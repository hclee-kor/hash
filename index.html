<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파일 해시(SHA-256) 검사기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>파일 해시(SHA-256) 검사기</h1>
        <p>파일을 아래 영역에 드래그 앤 드롭 하세요. (단일 파일만 지원)</p>

        <div id="drop-zone" class="drop-zone">
            <span id="drop-zone-text">여기로 파일을 드래그 앤 드롭 하거나<br>클릭하여 파일을 선택하세요.</span>
            <input type="file" id="file-input" style="display: none;">
        </div>

        <div id="result-area" class="result-area" style="display: none;">
            <h2>검사 결과</h2>
            <p><strong>파일명:</strong> <span id="file-name"></span></p>
            <p><strong>SHA-256:</strong> <span id="file-hash"></span></p>
            <p><strong>비고(Remark):</strong> <span id="file-remark"></span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
